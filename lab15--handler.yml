---
- name: Handler Demo
  hosts: servers
  become: true
  tasks:
    - name: Update web page
      ansible.builtin.copy:
        content: "Configuration Updated!"
        dest: /var/www/html/index.html
      notify: Restart Web Server
  handlers:
    - name: Restart Web Server
      ansible.builtin.service:
        name: apache2
        state: restarted
